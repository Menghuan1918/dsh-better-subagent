# dsh-better-subagent bundle patch: inserts the one host-plane row this package
# needs into the profile roster. Applied as a profile bundle layer; activate
# with `dsh plugin --profile <name> add @menghuan1918/dsh-better-subagent` (or
# `link:<path>` during development).
#
# The row name must be this package's scoped npm name: the Loader resolves a
# row's `name` as a module specifier, and `dsh-client-modules` discovers the
# browser half (`dsh.client` -> exports "./client") from that same manifest,
# requiring the manifest name to equal the row exactly. The client closure id
# is the package name too.
#
# The row registers, in one host-plane plugin:
#   - the Codex/Claude CLI llm adapters and the subagent routing bridge;
#   - the `wait_subagent` tool and the subagents-only child exit guard;
#   - the subagent-specific prompt sections (delegation, model tiers, PTC
#     fanout, CLI catalog, child guard);
#   - the read-only API /better-subagent/api/* (plus /apollo/api/* read
#     aliases) consumed by the row config page.
#
# Volatile row config (applies without reloading the row): childExitGuard,
# tiers.{fast,quality}, subagents.{eng,global}, subagents.{codex,claude}.*.
# Deployment flag, hand-written only: trustedHosts.
- insert:
    # Singleton PTC deadline-exemption row. The ask-user bundle inserts the
    # same id/name; the Loader deduplicates so both plugins share one service
    # and one runtime wrapper.
    - id: dsh-better-ptc
      name: dsh-better-ptc

    - id: dsh-better-subagent
      name: '@menghuan1918/dsh-better-subagent'
